# Local development database only (PostgreSQL + PostGIS). Credentials are not secrets.
# Start: docker compose up -d   ·   Stop: docker compose -p dogo down (keeps the volume)
name: dogo

services:
  db:
    # Pinned tag. The image is only published for amd64: emulated on Apple silicon.
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: dogo
      POSTGRES_USER: dogo
      POSTGRES_PASSWORD: dogo
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - dogo-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogo -d dogo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dogo-db:
